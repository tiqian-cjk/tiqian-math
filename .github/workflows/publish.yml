name: Stage Tiqian Math Maven release

# The stage job uploads the modules to Central staging. The registry job then
# describes the same module files on registry.tiqian.org: it uploads them to the
# GitHub release of v<version>, creating that release if it is missing, commits
# their metadata to tiqian-cjk/registry and deploys the registry site. A failed
# registry job is retried with "Re-run failed jobs", which reuses the module
# files the stage job kept.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven release version
        required: true
        type: string
      namespace:
        description: Central Portal namespace
        required: true
        default: org.tiqian
        type: string

permissions:
  contents: read

concurrency:
  group: stage-tiqian-math-maven-${{ inputs.version }}
  cancel-in-progress: false

env:
  # The tiqian-cjk/tiqian commit (v0.1.0-alpha.15) whose tools/ write, check and
  # merge the registry tree, the same scripts Tiqian's release runs. Move it when
  # those scripts change the tree format.
  TIQIAN_TOOLS_REF: dd504925da57e1326cf02e064543b4c8afed7626

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      TIQIAN_VERSION: ${{ inputs.version }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check out Tiqian Math
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate release inputs
        shell: bash
        # The registry job needs REGISTRY_REPO_TOKEN; checking it here keeps a
        # run without it from staging on Central first.
        env:
          REGISTRY_REPO_TOKEN: ${{ secrets.REGISTRY_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$TIQIAN_VERSION" == *-SNAPSHOT ]]; then
            echo "Central staging requires an immutable non-SNAPSHOT version." >&2
            exit 1
          fi
          if [[ ! "$TIQIAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "$TIQIAN_VERSION is not a version the registry and the v<version> tag accept." >&2
            exit 1
          fi
          for variable in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY REGISTRY_REPO_TOKEN; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required release secret $variable is missing." >&2
              exit 1
            fi
          done

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Compile runtime math fonts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check fonttools==4.63.0
          output="$RUNNER_TEMP/tiqian-math-fonts"
          script="font/metadata-generator/tools/compile_runtime_font.py"
          lete_regular_layout="$output/lete-regular-layout.otf"
          lete_regular_runtime="$output/lete-regular-runtime.otf"
          lete_bold_layout="$output/lete-bold-layout.otf"
          lete_bold_runtime="$output/lete-bold-runtime.otf"
          stix_layout="$output/stix-regular-layout.otf"
          stix_runtime="$output/stix-regular-runtime.otf"
          python3 "$script" \
            engine/src/jvmMain/resources/org/tiqian/math/fonts/LeteSansMath-Regular.otf \
            "$lete_regular_layout" \
            "$lete_regular_runtime"
          python3 "$script" \
            engine/src/jvmMain/resources/org/tiqian/math/fonts/LeteSansMath-Bold.otf \
            "$lete_bold_layout" \
            "$lete_bold_runtime"
          python3 "$script" \
            font/stix/src/commonMain/resources/org/tiqian/math/host-fonts/stix/regular.otf \
            "$stix_layout" \
            "$stix_runtime"
          {
            echo "TIQIAN_LETE_REGULAR_LAYOUT_FONT=$lete_regular_layout"
            echo "TIQIAN_LETE_REGULAR_RUNTIME_FONT=$lete_regular_runtime"
            echo "TIQIAN_LETE_BOLD_LAYOUT_FONT=$lete_bold_layout"
            echo "TIQIAN_LETE_BOLD_RUNTIME_FONT=$lete_bold_runtime"
            echo "TIQIAN_STIX_LAYOUT_FONT=$stix_layout"
            echo "TIQIAN_STIX_RUNTIME_FONT=$stix_runtime"
          } >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Bake runtime math metadata
        run: |
          ./gradlew \
            :font:metadata-generator:bakeLeteRuntimeMetadata \
            :font:metadata-generator:bakeStixRuntimeMetadata \
            --no-daemon

      - name: Verify platform-independent tests and release artifacts
        run: |
          ./gradlew \
            :engine:allTests \
            :font:stix:allTests \
            :font:tooling:test \
            :font:gradle-plugin:test \
            :font:metadata-generator:test \
            :scanner:test \
            assemble \
            publishMathComposeToMavenLocal \
            -PtiqianCompiledMathResources=true \
            -Dmaven.repo.local="$RUNNER_TEMP/tiqian-math-maven-preflight" \
            --no-daemon

      - name: Check out the Tiqian registry tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: tiqian-cjk/tiqian
          ref: ${{ env.TIQIAN_TOOLS_REF }}
          path: tiqian-tools
          sparse-checkout: tools
          persist-credentials: false

      - name: Collect the module files for the registry
        # The preflight repository holds the files of every module this run
        # uploads to Central. The Gradle plugin marker of math-gradle-plugin
        # (group org.tiqian.math.fonts) is left out: the registry describes the
        # org.tiqian group only. Removing a non-empty org/tiqian/math fails the
        # step, so a module published under that path is never dropped.
        shell: bash
        run: |
          set -euo pipefail
          preflight="$RUNNER_TEMP/tiqian-math-maven-preflight"
          rm -r "$preflight/org/tiqian/math/fonts"
          rmdir "$preflight/org/tiqian/math"
          python3 tiqian-tools/tools/write-maven-registry-tree.py collect \
            --maven-local "$preflight" \
            --version "$TIQIAN_VERSION" \
            --out "$RUNNER_TEMP/maven-publication" \
            --expect-manifest .github/registry-modules.json

      - name: Upload Tiqian Math modules
        run: ./gradlew publishMathToCentral -PtiqianCompiledMathResources=true --no-daemon

      - name: Create Central Portal deployment
        env:
          CENTRAL_NAMESPACE: ${{ inputs.namespace }}
        shell: bash
        run: |
          set -euo pipefail
          authorization="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          curl --fail-with-body --retry 3 \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/$CENTRAL_NAMESPACE?publishing_type=user_managed"

      - name: Keep the module files for the registry
        # Kept only after the Central deployment exists, so the registry never
        # describes a build that Central staging did not receive.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-gradle-publication
          path: ${{ runner.temp }}/maven-publication
          if-no-files-found: error

  registry:
    needs: [stage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TIQIAN_VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
    steps:
      - name: Check out Tiqian Math
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check out the Tiqian registry tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: tiqian-cjk/tiqian
          ref: ${{ env.TIQIAN_TOOLS_REF }}
          path: tiqian-tools
          sparse-checkout: tools
          persist-credentials: false

      - name: Download the module files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-gradle-publication
          path: maven-publication

      - name: Describe the modules in the registry tree
        # One package directory per module, listing its root coordinate and its
        # target coordinates. The files move to one flat directory under the
        # release asset names the metadata points at.
        shell: bash
        run: |
          set -euo pipefail
          python3 tiqian-tools/tools/write-maven-registry-tree.py write \
            --publication maven-publication \
            --assets maven-assets \
            --tree "$RUNNER_TEMP/maven-registry-tree" \
            --owner "${{ github.repository_owner }}" \
            --repository "$GITHUB_REPOSITORY" \
            --version "$TIQIAN_VERSION" \
            --expect-manifest .github/registry-modules.json
          python3 tiqian-tools/tools/check-registry-tree.py --tree "$RUNNER_TEMP/maven-registry-tree" --artifacts maven-assets

      - name: Create the GitHub release
        # The metadata points at assets of the v<version> release. An existing
        # release keeps its notes, but its tag must name the commit this run
        # built; a missing release is created as a pre-release for a version
        # with a pre-release suffix, with generated notes to edit afterwards.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # An annotated tag lists its commit under the peeled ref ^{}; a
          # lightweight tag names the commit itself. A missing tag lists nothing.
          refs="$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          tag_commit="$(awk -v tag="refs/tags/$RELEASE_TAG" \
            '$2 == tag "^{}" { peeled = $1 } $2 == tag { plain = $1 } END { print (peeled != "" ? peeled : plain) }' <<< "$refs")"
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::$RELEASE_TAG names $tag_commit, but this run built $GITHUB_SHA"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$RELEASE_TAG already has a release"
          else
            flags=()
            if [[ "$TIQIAN_VERSION" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi

      - name: Upload the module files to the release
        # An asset with the same bytes stays in place on a re-run; different
        # bytes stop the step.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for file in maven-assets/*; do
            [[ "$(basename "$file")" == SHA256SUMS ]] && continue
            files+=("$file")
          done
          bash tiqian-tools/tools/upload-release-assets.sh "$RELEASE_TAG" "${files[@]}"

      - name: Commit the metadata to the registry repository
        # Earlier versions in the registry stay in place, and a re-run writes
        # the same bytes, so its commit is empty and skipped.
        env:
          REGISTRY_REPO_TOKEN: ${{ secrets.REGISTRY_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          registry="$RUNNER_TEMP/registry"
          git clone "https://x-access-token:${REGISTRY_REPO_TOKEN}@github.com/tiqian-cjk/registry.git" "$registry"
          python3 tiqian-tools/tools/merge-registry-tree.py \
            --tree "$RUNNER_TEMP/maven-registry-tree" \
            --owner "${{ github.repository_owner }}" \
            --registry "$registry"
          cd "$registry"
          git config user.name "Release Bot"
          git config user.email "release@tiqian.dev"
          git add .
          if git diff --cached --quiet; then
            echo "registry metadata for $TIQIAN_VERSION is already current"
            exit 0
          fi
          git commit -m "release: $GITHUB_REPOSITORY $RELEASE_TAG"
          # Other releases push to the same repository. They write other package
          # directories, so a push that lost the race rebases and tries again.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" != 3 ]]; then
              git pull --rebase origin main
            fi
          done
          echo "::error::the registry repository refused the push three times"
          exit 1

      - name: Deploy the registry site
        # The Pages Git integration does not deploy every push to the registry
        # repository, so the deploy hook starts the production build.
        env:
          PAGES_DEPLOY_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: |
          if [[ -z "$PAGES_DEPLOY_HOOK" ]]; then
            echo "PAGES_DEPLOY_HOOK is not configured; skipping the deployment"
            exit 0
          fi
          curl -fsS -X POST "$PAGES_DEPLOY_HOOK" | head -c 200
